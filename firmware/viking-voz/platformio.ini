; viking-voz — o aparelho do estúdio (Sessão H1 do LifeOs, D70). XIAO ESP32-S3.
; Desde 2026-11-22 se compila e grava no Mac do dono, com a placa na USB dele, pelo servidor
; RFC2217 que o `~/esp32-mac` já roda em 127.0.0.1:4000 (o LaunchAgent `com.esp32.serve`, que
; aplica o reset da USB-Serial/JTAG). Um cliente por vez na porta: gravar, ler o serial e o
; monitor disputam a mesma placa. Ver BRINGUP.md, "No Mac".
[platformio]
default_envs = xiao_s3

[env]
; pioarduino: fork comunitário do core Arduino-ESP32. **Versão fixa** desde 2026-11-27 (H2m2, decisão do
; dono): a 61.04.00 (publicada em 2026-11-19, com o Arduino-ESP32 4.0.0 e o IDF 6.1.1), a que estava
; instalada. Antes era o "stable", que muda sozinho (foi assim que o 4.0.0 chegou). Subir de versão é um
; commit próprio, com o firmware de uso comparado antes e depois.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
framework = arduino
upload_port = rfc2217://127.0.0.1:4000?ign_set_control
monitor_port = rfc2217://127.0.0.1:4000?ign_set_control
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_type = debug

; Seeed XIAO ESP32S3 — USB nativa (USB-Serial/JTAG), 8MB flash, PSRAM
[env:xiao_s3]
board = seeed_xiao_esp32s3
upload_speed = 921600
; o uso não compila o teste do modelo (src/teste_modelo/). A escuta (H2m2) só existe com o
; src/modelo.h (`gerar_modelo.py gerar --so-modelo`, fora do git): sem ele, o firmware é o de antes.
; As libs da escuta vêm de lib/ (`buscar_libs.sh`); o LDF (o modo padrão, chain) as acha pelos
; #include da escuta, e sem o modelo.h nada as chama. Os kernels: os do ESP-NN desde o C5 da H2m2
; (2026-11-28): as 65 saídas iguais às dos de referência (diferença 0) e o Invoke de 13,8 para 1,6 ms.
build_src_filter = +<*> -<teste_modelo/>
lib_ignore = tflm
build_flags =
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    -DFLATBUFFERS_LOCALE_INDEPENDENT=0
    -DFLATBUFFERS_PREFER_PRINTF=1
    -DESP_NN
    -DCONFIG_NN_OPTIMIZED
    -DCONFIG_IDF_TARGET_ESP32S3=1

; H2m1 (D73): o teste do modelo da wake word na placa, sem o microfone e sem a rede. Antes de
; compilar: `bash buscar_libs.sh` e `python gerar_modelo.py gerar ...` (os dois escrevem fora do
; git). Gravar este env desliga a voz do estúdio até o `xiao_s3` voltar: só com o ok do dono.
; As definições do TFLM valem também para quem inclui os cabeçalhos dele (o tamanho das estruturas
; muda com elas), por isso ficam no env inteiro e não só na lib.
[env:xiao_s3_modelo]
board = seeed_xiao_esp32s3
upload_speed = 921600
build_type = release
build_src_filter = +<teste_modelo/>
lib_ignore = tflm_nn, esp-nn
build_flags =
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    -DFLATBUFFERS_LOCALE_INDEPENDENT=0
    -DFLATBUFFERS_PREFER_PRINTF=1

; H2m2: o mesmo teste, com os kernels do ESP-NN (lib/tflm_nn e lib/esp-nn, de `buscar_libs.sh`). O
; ESP_NN e as duas definições do S3 ficam no env inteiro: o `esp_nn.h` escolhe a versão do S3 por
; elas, e a lib e os kernels do TFLM têm de escolher a mesma. Gravar só com o ok do dono.
[env:xiao_s3_modelo_nn]
board = seeed_xiao_esp32s3
upload_speed = 921600
build_type = release
build_src_filter = +<teste_modelo/>
lib_ignore = tflm
build_flags =
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    -DFLATBUFFERS_LOCALE_INDEPENDENT=0
    -DFLATBUFFERS_PREFER_PRINTF=1
    -DESP_NN
    -DCONFIG_NN_OPTIMIZED
    -DCONFIG_IDF_TARGET_ESP32S3=1
