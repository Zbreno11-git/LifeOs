# Portões do Viking a cada push: os mesmos que `AGENTS.md` ("Comandos") manda rodar à mão.
# O CI verifica, não publica: sem segredo nenhum (o log é público, o repo também), permissão só de
# leitura, actions fixadas por SHA (a tag fica no comentário). D45.
name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portoes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 no VPS, 3.13 no Mac do dono (medido em 2026-09-28); `tests/test_lock.py` usa os mesmos
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python }}
      - name: Instalar exatamente o uv.lock
        run: uv sync --locked --extra dev
      - name: Testes (2 pulados esperados, os contratos com o clone do Jev)
        run: uv run --locked python -m pytest -q -rs
      - name: Lint
        run: uv run --locked python -m ruff check .
      - name: Formatação
        run: uv run --locked python -m ruff format --check .
      - name: Falhas conhecidas nas dependências do lock
        # Nenhuma ignorada: ignorar uma falha é decisão do dono, escrita na D45.
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-extras --format requirements-txt > requisitos.txt
          uvx pip-audit==2.10.1 -r requisitos.txt --no-deps --disable-pip --progress-spinner off
