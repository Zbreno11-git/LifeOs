# Portões do Viking a cada push: os mesmos que `AGENTS.md` ("Comandos") manda rodar à mão.
# O CI verifica, não publica: sem segredo nenhum, permissão só de leitura, actions fixadas por SHA
# (a tag fica no comentário). D45. O repo virou privado em 2026-09-29 (D58); a regra fica, e o
# gitleaks entrou no lugar do secret scanning do GitHub.
name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portoes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 no VPS, 3.13 no Mac do dono (medido em 2026-09-28); `tests/test_lock.py` usa os mesmos
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # o histórico inteiro: o scanner de segredos lê todos os commits
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python }}
      - name: Segredos (gitleaks no histórico inteiro; versão e sha256 fixados no script)
        run: bash scripts/gitleaks.sh git --redact --no-banner .
      - name: Instalar exatamente o uv.lock (com o extra da nuvem, que só roda no Linux)
        run: uv sync --locked --extra dev --extra nuvem
      - name: Emulador do Firestore (baixar e conferir o sha256)
        run: VIKING_EMULADOR_SO_BAIXAR=1 bash scripts/emulador_firestore.sh
      - name: Testes (2 pulados esperados, os contratos com o clone do Jev)
        env:
          VIKING_EXIGIR_GITLEAKS: "1" # o canário do scanner roda aqui, não é pulado
          VIKING_EXIGIR_EMULADOR: "1" # o contrato do Firestore roda aqui, não é pulado
        run: VIKING_JAVA="$JAVA_HOME_21_X64/bin/java" uv run --locked python -m pytest -q -rs
      - name: Lint
        run: uv run --locked python -m ruff check .
      - name: Formatação
        run: uv run --locked python -m ruff format --check .
      - name: Tipos (só os módulos de dados; a lista está no pyproject)
        run: uv run --locked python -m mypy
      - name: Falhas conhecidas nas dependências do lock
        # Nenhuma ignorada: ignorar uma falha é decisão do dono, escrita na D45.
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-extras --format requirements-txt > requisitos.txt
          uvx pip-audit==2.10.1 -r requisitos.txt --no-deps --disable-pip --progress-spinner off
