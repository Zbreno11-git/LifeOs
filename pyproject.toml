[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeos"
version = "0.1.0"
description = "Viking (Life OS) — assistente pessoal: calendário, navegador e lembretes"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "python-dotenv",
    "google-auth-oauthlib",
    "google-api-python-client",
    "google-auth",
    "mcp",
    "fastmcp",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
hardware = ["pyserial"]

[project.scripts]
viking = "lifeos.cli:main"

[tool.uv]
# O lock tem de instalar sem compilar nada nas máquinas que rodam o Viking: o Mac do dono é Intel
# (2017, macOS 13), e o VPS e o CI são Linux x86_64. Medido em 2026-09-28: o cryptography deixou de
# publicar wheel para Mac Intel na 49.0.0 — sem esta lista, o lock pegava a 50.0.1 e o `uv sync` no
# Mac teria de compilar do código-fonte (Rust).
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# O código-fonte conta como "compatível" com essas plataformas, então esta lista sozinha não impede
# uma versão sem wheel: quem impede é `tests/test_lock.py`, que lê o lock (`no-build = true` fazia
# isso no uv 0.12, mas o uv 0.11 do Mac o aplica ao próprio Viking e recusa instalar; 2026-09-28).
# A mesma versão em toda máquina: sem esta linha o lock se divide (48.0.1 no Mac, 50.0.1 no Linux) e
# o CI testaria outra coisa. Tirar quando o cryptography voltar a publicar wheel para Mac Intel ou
# o Mac do dono deixar de ser Intel (D45).
constraint-dependencies = ["cryptography<49"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# As skills são texto de outro projeto, copiado como veio; o ruff reformataria o Python dos `.md`.
extend-exclude = [".claude"]

[tool.ruff.format]
# Nos `.md` o Python é citação (o patch do Jev em `docs/arquitetura/`, exemplos): fica como veio.
exclude = ["*.md"]
