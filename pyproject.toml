[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeos"
version = "0.1.0"
description = "Viking (Life OS) — assistente pessoal: calendário, navegador e lembretes"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "python-dotenv",
    "google-auth-oauthlib",
    "google-api-python-client",
    "google-auth",
    "mcp",
    "fastmcp",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
hardware = ["pyserial"]

[project.scripts]
viking = "lifeos.cli:main"

[tool.uv]
# O lock tem de servir as máquinas que rodam o Viking: o Mac do dono é Intel (2017, macOS 13, Python
# 3.13) e o VPS e o CI são Linux x86_64. Código-fonte conta como "compatível" com essas plataformas,
# então quem exige wheel é `tests/test_lock.py`, que lê o lock. Única exceção, decidida pelo dono em
# 2026-09-28 (D45): o cryptography deixou de publicar wheel para Mac Intel na 49.0.0, e o Mac o
# compila (Rust instalado, e o `pip` já tinha compilado a 50.0.1 lá, medido); a 48.0.1, a última com
# wheel, tem 3 falhas conhecidas. `no-build = true` não serve: o uv 0.11 do Mac o aplica ao próprio
# Viking e recusa instalar.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# As skills são texto de outro projeto, copiado como veio; o ruff reformataria o Python dos `.md`.
extend-exclude = [".claude"]

[tool.ruff.format]
# Nos `.md` o Python é citação (o patch do Jev em `docs/arquitetura/`, exemplos): fica como veio.
exclude = ["*.md"]

[tool.mypy]
# Portão do CI desde a Sessão 9 (dono, 2026-09-29), só nos módulos de dados: o repo inteiro tem
# 68 erros (backlog em `sessoes.md`). `tests/test_ci_workflow.py` exige aqui todo módulo que
# abre o banco.
files = [
    "src/lifeos/banco.py",
    "src/lifeos/reminders",
    "src/lifeos/registro.py",
    "src/lifeos/confirmacao.py",
]
