[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeos"
version = "0.1.0"
description = "Viking (Life OS) — assistente pessoal: calendário, navegador e lembretes"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "python-dotenv",
    "google-auth-oauthlib",
    "google-api-python-client",
    "google-auth",
    "mcp",
    "fastmcp",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
hardware = ["pyserial"]

[project.scripts]
viking = "lifeos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
